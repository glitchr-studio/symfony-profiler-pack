name: CI

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:
  # release.yml runs this CI on a tag before the release.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No 8.0.* row: every Symfony 8.0 release is affected by PKSA-jvt1-tggb-8w72 (fixed in 7.4.23
        # and 8.1.11, never in 8.0, which is no longer maintained), so Composer refuses to install it.
        include:
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.4', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.1.*' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install
        run: >
          composer update --no-interaction --no-progress
          --with "symfony/framework-bundle:${{ matrix.symfony }}"
          --with "symfony/twig-bundle:${{ matrix.symfony }}"
          --with "symfony/web-profiler-bundle:${{ matrix.symfony }}"

      - name: Tests
        run: vendor/bin/phpunit
